<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto – Carlos Rojas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--font:'JetBrains Mono',monospace;--pri:#61dafb;--bg:#1e1e1e;--txt:#e0e0e0}
    *{box-sizing:border-box;margin:0;padding:0} html,body{height:100%}
    body{font-family:var(--font);background:var(--bg);color:var(--txt)}
    .navbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:rgba(30,30,30,.8);backdrop-filter:blur(8px);z-index:10}
    .logo{color:var(--pri);font-weight:700;font-size:1.4rem}
    .nav-links{list-style:none;display:flex;gap:1.25rem}
    .nav-links a{text-decoration:none;color:#ddd}.nav-links a.active,.nav-links a:hover{color:var(--pri)}
    .page-hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:url('images/contact-hero.jpg') center/cover no-repeat;position:relative}
    .page-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.45),rgba(0,0,0,.55))}
    .hero-inner{position:relative;text-align:center;padding:2rem 1.5rem;border:1px solid rgba(97,218,251,.35);background:rgba(15,15,15,.55);backdrop-filter:blur(6px);border-radius:10px}
    .hero-inner h1{color:var(--pri);font-size:2.25rem}
    .container{max-width:900px;margin:0 auto;padding:2rem 1rem}
    .card{background:rgba(60,60,60,.8);border:1px solid rgba(97,218,251,.2);border-radius:10px;padding:1rem;margin:.85rem 0}
    .form{display:grid;gap:.8rem}
    input,textarea,button{font-family:var(--font);padding:.8rem;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:#2b2b2b;color:#eee}
    button{background:var(--pri);color:#111;font-weight:700;cursor:pointer}
    .lang-switcher{position:fixed;top:1rem;left:1rem;background:rgba(30,30,30,.85);padding:.25rem .5rem;border-radius:8px;z-index:20}
    .lang-switcher button{background:none;border:none;color:#ddd;font-weight:700;cursor:pointer}
    .lang-switcher button.active{color:var(--pri)}
    footer{padding:2rem 1rem;text-align:center;background:#111;margin-top:2rem}
  </style>
</head>
<body>
  <div class="lang-switcher"><button id="lang-es" class="active">ES</button> | <button id="lang-en">EN</button></div>

  <nav class="navbar">
    <div class="logo">Carlos Rojas</div>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="about.html">Sobre mí</a></li>
      <li><a href="experience.html">Experiencia</a></li>
      <li><a href="projects.html">Proyectos</a></li>
      <li><a href="research.html">Investigación</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contacto</a></li>
    </ul>
  </nav>

  <header class="page-hero">
    <div class="hero-inner">
      <div class="lang" data-lang="es"><h1>Contacto</h1></div>
      <div class="lang" data-lang="en" style="display:none"><h1>Contact</h1></div>
    </div>
  </header>

  <main class="container">
    <div class="lang" data-lang="es">
      <div class="card"><h3>Email</h3><p><a href="mailto:contact.carlosrojas@gmail.com" style="color:var(--pri)">contact.carlosrojas@gmail.com</a></p></div>
      <div class="card"><h3>Mensaje rápido</h3>
        <form class="form" onsubmit="event.preventDefault(); alert('Gracias, Carlos responderá pronto.');">
          <input type="text" placeholder="Tu nombre" required>
          <input type="email" placeholder="Tu email" required>
          <textarea rows="5" placeholder="Tu mensaje" required></textarea>
          <button type="submit">Enviar</button>
        </form>
      </div>
    </div>
    <div class="lang" data-lang="en" style="display:none">
      <div class="card"><h3>Email</h3><p><a href="mailto:contact.carlosrojas@gmail.com" style="color:var(--pri)">contact.carlosrojas@gmail.com</a></p></div>
      <div class="card"><h3>Quick message</h3>
        <form class="form" onsubmit="event.preventDefault(); alert('Thanks! Carlos will reply soon.');">
          <input type="text" placeholder="Your name" required>
          <input type="email" placeholder="Your email" required>
          <textarea rows="5" placeholder="Your message" required></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </main>

  <footer><p>© 2025 Carlos Rojas</p></footer>

  <script>
    const setLang=(l)=>{document.documentElement.lang=l;document.querySelectorAll('.lang').forEach(e=>e.style.display=e.dataset.lang===l?'block':'none');document.querySelectorAll('#lang-es,#lang-en').forEach(b=>b.classList.toggle('active',b.id==='lang-'+l));};
    document.getElementById('lang-es').onclick=()=>setLang('es');document.getElementById('lang-en').onclick=()=>setLang('en');setLang('es');
    (function(){const here=location.pathname.split('/').pop()||'contact.html';document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===here));})();
    window.addEventListener('scroll',()=>{const n=document.querySelector('.navbar');if(scrollY>50){n.style.background='rgba(30,30,30,.95)';n.style.boxShadow='0 2px 20px rgba(0,0,0,.5)';}else{n.style.background='rgba(30,30,30,.8)';n.style.boxShadow='none';}});
  </script>
</body>
</html>
